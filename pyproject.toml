[project]
name = "imgs2xl"
dynamic = ["version"]
description = "Output an Excel sheet with thumbnails from an image files."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "T.Fujiba" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openpyxl>=3.1.5",
    "Pillow>=11.3.0",
    "filetype>=1.2.0",
    "defusedxml>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/fujiba/imgs2xl"

[project.scripts]
imgs2xl = "imgs2xl.cli:main"

[project.gui-scripts]
gimgs2xl = "imgs2xl.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "imgs2xl/__init__.py"

[dependency-groups]
dev = [
    "nuitka>=2.3",
]