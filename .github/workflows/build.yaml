name: Build binary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            nuitka_extra: "--macos-create-app-bundle"
          - os: windows-latest
            nuitka_extra: "--windows-console-mode=disable"

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # macOS では Homebrew の tcl-tk パスを明示的に設定する必要がある
    # brew --prefix を使うことで Intel/ARM 両方のランナーに対応
    - name: Set Tcl/Tk path (macOS)
      if: runner.os == 'macOS'
      run: |
        TCL_TK_PREFIX=$(brew --prefix tcl-tk)
        echo "${TCL_TK_PREFIX}/bin" >> $GITHUB_PATH
        echo "LDFLAGS=-L${TCL_TK_PREFIX}/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I${TCL_TK_PREFIX}/include" >> $GITHUB_ENV
        echo "TCL_LIBRARY=${TCL_TK_PREFIX}" >> $GITHUB_ENV
        echo "TK_LIBRARY=${TCL_TK_PREFIX}" >> $GITHUB_ENV

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install packages
      run: uv sync --all-extras

    - name: Build with Nuitka
      run: >
        uv run nuitka
        --assume-yes-for-downloads
        --standalone
        --enable-plugin=tk-inter
        --enable-plugin=numpy
        ${{ matrix.nuitka_extra }}
        imgs2xl/gui.py

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: tar cvfz gui.app.tgz gui.app/*

    - name: Package (Windows)
      if: runner.os == 'Windows'
      run: Compress-Archive -Path gui.dist -DestinationPath gui.dist.zip

    - name: Upload artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: imgs2xl-macOS
        path: ./gui.app.tgz

    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: imgs2xl-Windows
        path: ./gui.dist.zip
